        <!-- BOTTOM BUTTON CONTROL BAR -->
        <!-- ============================================================ -->
        <g id="button-groups" transform="translate(0, 0)">

          <!-- 1. BUTTON: 加圧する (Pressurize / Compress) -->
          <g id="btn-pressurize-group">
            <!-- Inactive (Normal clickable) -->
            <g id="btn-pressurize-inactive" class="btn-pressurize cursor-pointer">
              <use width="130" height="48" transform="translate(145 566)" xlink:href="#_加圧する-valid" />
            </g>
            <!-- Active (Pressed / Click) -->
            <g id="btn-pressurize-active" class="btn-pressurize cursor-pointer" style="visibility: hidden;">
              <use width="130" height="48" transform="translate(145 566)" xlink:href="#_加圧する-push" />
            </g>
            <!-- Disabled (Grayed out) -->
            <g id="btn-pressurize-disabled" class="btn-pressurize" style="visibility: hidden;">
              <use width="130" height="48" transform="translate(145 566)" xlink:href="#_加圧する-invalid" />
            </g>
          </g>

          <!-- 2. BUTTON: 減圧する (Decompress / Expand) -->
          <g id="btn-depressurize-group">
            <!-- Inactive -->
            <g id="btn-depressurize-inactive" class="btn-depressurize cursor-pointer" style="visibility: hidden;">
              <use width="130" height="48" transform="translate(295 566)" xlink:href="#_減圧する-valid" />
            </g>
            <!-- Active -->
            <g id="btn-depressurize-active" class="btn-depressurize cursor-pointer" style="visibility: hidden;">
              <use width="130" height="48" transform="translate(295 566)" xlink:href="#_減圧する-push" />
            </g>
            <!-- Disabled -->
            <g id="btn-depressurize-disabled" class="btn-depressurize">
              <use width="130" height="48" transform="translate(295 566)" xlink:href="#_減圧する-invalid" />
            </g>
          </g>

          <!-- 3. BUTTON: すこし戻る (Step Backward) -->
          <g id="btn-step-back-group">
            <!-- Inactive -->
            <g id="btn-step-back-inactive" class="btn-step-back cursor-pointer" style="visibility: hidden;">
              <use width="44" height="48" transform="translate(483 566)" xlink:href="#_少し戻る" />
            </g>
            <!-- Active -->
            <g id="btn-step-back-active" class="btn-step-back cursor-pointer" style="visibility: hidden;">
              <use width="44" height="48" transform="translate(483 566)" xlink:href="#_少し戻る-push" />

            <!-- Disabled -->

              <use width="44" height="48" transform="translate(483 566)" xlink:href="#_少し戻る-invalid" />
            </g>
          </g>

          <!-- 4. BUTTON: 一時停止 / 再開 (Pause / Resume) -->
          <g id="btn-pause-group">
            <!-- PAUSE STATE: Inactive (Normal) -->
            <g id="btn-pause-inactive" class="btn-pause cursor-pointer" style="visibility: hidden;">
              <use width="146" height="48" transform="translate(547 566)" xlink:href="#_一時停止-valid1" />
            </g>
            <!-- PAUSE STATE: Active (Pressed) -->
            <g id="btn-pause-active" class="btn-pause cursor-pointer" style="visibility: hidden;">
              <use width="146" height="48" transform="translate(547 566)" xlink:href="#_一時停止-push" />
            </g>
            <!-- RESUME STATE: Inactive -->
            <g id="btn-pause-resume-inactive" class="btn-pause cursor-pointer" style="visibility: hidden;">
              <use width="146" height="48" transform="translate(547 566)" xlink:href="#_再開-valid" />
            </g>
            <!-- RESUME STATE: Active -->
            <g id="btn-pause-resume-active" class="btn-pause cursor-pointer" style="visibility: hidden;">
              <use width="146" height="48" transform="translate(547 566)" xlink:href="#_再開-push" />
            </g>
            <!-- Disabled State -->
            <g id="btn-pause-disabled" class="btn-pause">
              <use width="146" height="48" transform="translate(547 566)" xlink:href="#_一時停止-invalid" />
            </g>
          </g>

          <!-- 5. BUTTON: すこし進む (Step Forward) -->
          <g id="btn-step-forward-group">
            <!-- Inactive -->
            <g id="btn-step-forward-inactive" class="btn-step-forward cursor-pointer" style="visibility: hidden;">
              <use width="44" height="48" transform="translate(713 566)" xlink:href="#_少し進む-valid" />

            </g>
          </g>
