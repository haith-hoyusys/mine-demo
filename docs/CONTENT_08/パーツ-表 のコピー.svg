  <g id="DESCRIPTION">
    <g>
      <text transform="translate(80.73 115.38)" style="fill: none; font-size: 16px; stroke: #fff; stroke-linejoin: round; stroke-width: 3px;"><tspan style="font-family: rounded-mplus-1p-heavy, &apos;Rounded M+ 1p&apos;; font-weight: 800;"><tspan x="0" y="0">[改修点]</tspan></tspan><tspan style="font-family: rounded-mplus-1p-regular, &apos;Rounded M+ 1p&apos;;"><tspan x="0" y="20">既存コンテンツ「交点の位置ベクトル」の動作を踏襲する</tspan></tspan><tspan style="font-family: rounded-mplus-1p-regular, &apos;Rounded M+ 1p&apos;;"><tspan x="0" y="40">変更点</tspan></tspan><tspan style="font-family: rounded-mplus-1p-regular, &apos;Rounded M+ 1p&apos;;"><tspan x="0" y="60">・三角形</tspan><tspan x="64" y="60" style="letter-spacing: -.03em;">O</tspan><tspan x="76.22" y="60" style="letter-spacing: 0em;">ABの形状</tspan></tspan><tspan style="font-family: rounded-mplus-1p-regular, &apos;Rounded M+ 1p&apos;;"><tspan x="0" y="80">・点Cの位置（</tspan><tspan x="106.96" y="80" style="letter-spacing: -.03em;">O</tspan><tspan x="119.18" y="80" style="letter-spacing: 0em;">Aを3：2に内分）</tspan></tspan><tspan style="font-family: rounded-mplus-1p-regular, &apos;Rounded M+ 1p&apos;;"><tspan x="0" y="100">・点Dの位置（OBの中点）</tspan></tspan></text>
      <text transform="translate(80.73 115.38)" style="fill: red; font-size: 16px;"><tspan style="font-family: rounded-mplus-1p-heavy, &apos;Rounded M+ 1p&apos;; font-weight: 800;"><tspan x="0" y="0">[改修点]</tspan></tspan><tspan style="font-family: rounded-mplus-1p-regular, &apos;Rounded M+ 1p&apos;;"><tspan x="0" y="20">既存コンテンツ「交点の位置ベクトル」の動作を踏襲する</tspan></tspan><tspan style="font-family: rounded-mplus-1p-regular, &apos;Rounded M+ 1p&apos;;"><tspan x="0" y="40">変更点</tspan></tspan><tspan style="font-family: rounded-mplus-1p-regular, &apos;Rounded M+ 1p&apos;;"><tspan x="0" y="60">・三角形</tspan><tspan x="64" y="60" style="letter-spacing: -.03em;">O</tspan><tspan x="76.22" y="60" style="letter-spacing: 0em;">ABの形状</tspan></tspan><tspan style="font-family: rounded-mplus-1p-regular, &apos;Rounded M+ 1p&apos;;"><tspan x="0" y="80">・点Cの位置（</tspan><tspan x="106.96" y="80" style="letter-spacing: -.03em;">O</tspan><tspan x="119.18" y="80" style="letter-spacing: 0em;">Aを3：2に内分）</tspan></tspan><tspan style="font-family: rounded-mplus-1p-regular, &apos;Rounded M+ 1p&apos;;"><tspan x="0" y="100">・点Dの位置（OBの中点）</tspan></tspan></text>
